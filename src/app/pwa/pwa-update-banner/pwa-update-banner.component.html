@if (pwaUpdateService.updateAvailable() && !isDismissed()) {
  <div class="pwa-banner-card">
    <div class="pwa-banner-header">
      <div class="pwa-banner-badge-wrapper">
        <app-system-update-alt-icon class="pwa-banner-badge-icon" />
      </div>
      <div class="pwa-banner-content">
        <h4 class="pwa-banner-title">App Update Ready</h4>
        <p class="pwa-banner-desc">
          We've added new performance boosts and layout enhancements. Reload to apply instantly.
        </p>
      </div>
    </div>
    <div class="pwa-banner-actions">
      <button (click)="dismiss()" class="pwa-banner-btn-secondary">Later</button>
      <button (click)="pwaUpdateService.reloadPage()" class="pwa-banner-btn-primary">Reload Now</button>
    </div>
  </div>
}
