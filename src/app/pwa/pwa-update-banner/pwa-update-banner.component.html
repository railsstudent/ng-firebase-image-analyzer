@if (pwaUpdateService.updateAvailable() && !isDismissed()) {
  <div class="pwa-banner-card border shadow-lg">
    <div class="flex items-center gap-4">
      <div class="pwa-banner-badge-wrapper bg-primary/10 shrink-0">
        <app-download-icon class="text-primary" />
      </div>
      <h4 class="font-semibold leading-snug">App Update Ready</h4>
    </div>
    <div class="pwa-banner-actions justify-end gap-3">
      <button (click)="dismiss()" class="font-bold pwa-banner-btn pwa-banner-btn-secondary">Later</button>
      <button (click)="pwaUpdateService.reloadPage()" class="font-bold pwa-banner-btn pwa-banner-btn-primary">
        Reload Now
      </button>
    </div>
  </div>
}
