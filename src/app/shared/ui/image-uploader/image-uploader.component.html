<div class="relative">
  <!-- Error Message Banner -->
  @if (errorMessage()) {
    <div class="error-banner">
      <span class="error-banner-text">
        {{ errorMessage() }}
      </span>
    </div>
  }

  <!-- Uploader Panel -->
  <div
    class="uploader-panel"
    [class.is-dragging]="isDragging()"
    [class.has-image]="imageUrl()"
    tabindex="0"
    role="button"
    (dragover)="onDragState($event, true)"
    (dragleave)="onDragState($event, false)"
    (drop)="onDrop($event)"
    (click)="openFilePicker(fileInput)"
    (keydown.enter)="openFilePicker(fileInput)"
    (keydown.space)="openFilePicker(fileInput, $event)"
  >
    <input
      #fileInput
      type="file"
      class="hidden"
      accept="image/*"
      (click)="$event.stopPropagation()"
      (change)="onFileSelected($event)"
    />

    @if (imageUrl()) {
      <!-- Image Preview Area -->
      <div class="preview-area">
        <img [src]="imageUrl()" class="preview-image" alt="Selected preview" />

        <!-- Hover Remove Action -->
        <button
          type="button"
          class="remove-btn"
          (click)="removeImage($event, fileInput)"
          (keydown)="$event.stopPropagation()"
          title="Remove Image"
        >
          <app-delete-icon />
        </button>
      </div>
    } @else {
      <!-- Empty Upload State -->
      <div class="empty-state">
        <div class="upload-icon-wrapper">
          <app-cloud-upload-icon />
        </div>
        <div class="space-y-1">
          <p class="font-semibold text-lg text-on-surface">Drag & drop your image here</p>
          <p class="text-sm text-on-surface-variant">
            or <span class="text-primary font-semibold hover:underline">browse files</span>
          </p>
        </div>
        <p class="text-xs text-outline">Supports JPEG, JPG, PNG, WebP up to 20MB</p>
      </div>
    }
  </div>
</div>
