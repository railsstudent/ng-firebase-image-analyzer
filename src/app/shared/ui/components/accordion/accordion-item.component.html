<div class="accordion-item">
  @let headerId = 'accordion-header-' + id();
  @let panelId = 'accordion-panel-' + id();
  <button
    type="button"
    #triggerButton
    class="accordion-trigger"
    [attr.id]="headerId"
    [attr.aria-expanded]="isExpanded()"
    [disabled]="isDisabled()"
    [attr.aria-disabled]="isDisabled()"
    [attr.aria-controls]="panelId"
    (click)="toggle()"
  >
    <div class="accordion-trigger-content">
      <ng-content select="[accordion-header]" />
    </div>
    <app-expand-more-icon class="accordion-chevron" [class.rotate-180]="isExpanded()" />
  </button>

  <div
    [attr.id]="panelId"
    role="region"
    [attr.aria-labelledby]="headerId"
    [hidden]="!isExpanded()"
    class="accordion-panel"
  >
    <ng-content select="[accordion-body]" />
  </div>
</div>
