<div class="accordion-item border border-surface-glass-border">
  @let headerId = `accordion-header-${id()}`;
  @let panelId = `accordion-panel-${id()}`;
  <button
    type="button"
    #triggerButton
    class="accordion-trigger scroll-mt-20 rounded-2xl"
    [class]="isDisabled() ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'"
    [attr.id]="headerId"
    [attr.aria-expanded]="isExpanded()"
    [disabled]="isDisabled()"
    [attr.aria-disabled]="isDisabled()"
    [attr.aria-controls]="panelId"
    (click)="toggle()"
  >
    <div class="flex-1 min-w-0">
      <ng-content select="[accordion-header]" />
    </div>
    <app-expand-more-icon
      class="size-5 transition-transform text-on-surface-variant"
      [class.rotate-180]="isExpanded()"
    />
  </button>

  <div
    [attr.id]="panelId"
    role="region"
    [attr.aria-labelledby]="headerId"
    [hidden]="!isExpanded()"
    class="px-4 pb-4 pt-1"
  >
    <ng-content select="[accordion-body]" />
  </div>
</div>
