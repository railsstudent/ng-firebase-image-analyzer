<div class="accordion-item">
  <button
    type="button"
    class="accordion-trigger"
    [attr.id]="'accordion-header-' + id()"
    [attr.aria-expanded]="isExpanded()"
    [attr.aria-controls]="'accordion-panel-' + id()"
    (click)="toggle()"
  >
    <div class="accordion-trigger-content">
      <ng-content select="[accordion-header]" />
    </div>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
      class="accordion-chevron"
      [class.rotate-180]="isExpanded()"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  <div
    [attr.id]="'accordion-panel-' + id()"
    role="region"
    [attr.aria-labelledby]="'accordion-header-' + id()"
    [hidden]="!isExpanded()"
    class="accordion-panel"
  >
    <ng-content select="[accordion-body]" />
  </div>
</div>
