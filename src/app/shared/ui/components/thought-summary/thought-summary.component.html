<div class="section-card space-y-4">
  <h3 class="section-title">
    <app-psychology-icon class="text-primary text-2xl" />
    <span>AI Reasoning Overview</span>
  </h3>

  <div class="space-y-3">
    <p class="text-on-surface-variant leading-relaxed">
      <span class="font-bold text-on-surface gap-2">Source:</span> {{ displaySource() }}
    </p>
    <p class="text-on-surface-variant leading-relaxed">{{ thoughtSummary() }}</p>

    @if (remarks(); as remarkList) {
      <app-recommendation-list [listTitle]="remarksTitle()">
        @for (remark of remarkList; track $index; let i = $index) {
          <app-recommendation-item> {{ i + 1 }}. {{ remark }} </app-recommendation-item>
        }
      </app-recommendation-list>
    } @else {
      <app-list-skeleton />
    }
  </div>
</div>
