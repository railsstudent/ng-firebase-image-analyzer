<div class="analysis-section-card space-y-4">
  <h3 class="section-title">
    <app-psychology-icon class="section-title-icon" />
    AI Reasoning Overview
  </h3>

  <div class="space-y-3">
    <p class="reasoning-text"><span class="thought-label">Source:</span> {{ displaySource() }}</p>
    <p class="reasoning-text">{{ thoughtSummary() }}</p>

    @if (remarks(); as remarkList) {
      <app-recommendation-list [listTitle]="remarksTitle()">
        @for (remark of remarkList; track remark; let i = $index) {
          <app-recommendation-item> {{ i + 1 }}. {{ remark }} </app-recommendation-item>
        }
      </app-recommendation-list>
    } @else {
      <div class="animate-pulse space-y-2 py-3">
        <div class="skeleton-line w-3/4"></div>
        <div class="skeleton-line w-1/2"></div>
      </div>
    }
  </div>
</div>
