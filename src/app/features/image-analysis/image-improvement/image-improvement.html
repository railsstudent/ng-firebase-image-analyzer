<div class="analysis-section-card space-y-4">
  <h3 class="section-title">
    <span class="material-symbols-outlined section-title-icon">photo_filter</span>
    AI-Enhanced Image Generation
  </h3>

  @if (analysis() === null || analysis()?.crop === undefined || analysis()?.colorAdjustment === undefined) {
    <div class="animate-pulse grid grid-cols-1 md:grid-cols-2 gap-6 py-4">
      <div class="skeleton-block h-48"></div>
      <div class="space-y-4">
        <div class="skeleton-line h-6 w-1/2"></div>
        <div class="skeleton-line w-5/6"></div>
        <div class="skeleton-line w-2/3"></div>
      </div>
    </div>
  } @else {
    <div class="improvement-grid">
      <app-image-crop
        [colorAdjustment]="safeColorAdjustment()"
        [aspectRatio]="cropImage().containerStyle.aspectRatio"
        [cropPosition]="cropPosition()"
      />

      <!-- Enhanced Canvas -->
      <app-enhanced-canvas
        [imageUrl]="imageUrl()"
        [cropImage]="cropImage()"
        [colorAdjustment]="safeColorAdjustment()"
      />
    </div>
  }
</div>
