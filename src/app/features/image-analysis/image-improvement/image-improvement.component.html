<div class="section-card space-y-4">
  <h3 class="section-title">
    <app-auto-awesome-icon />
    Visual Enhancer Calibration
  </h3>

  @if (showSkeleton()) {
    <app-image-improvement-skeleton />
  } @else {
    <div class="improvement-grid grid gap-6">
      <app-image-crop [calibration]="calibration()" [aspectRatio]="cropStyles().containerStyle.aspectRatio" />

      <!-- Enhanced Canvas -->
      <app-enhanced-canvas
        [imageUrl]="imageUrl()"
        [calibration]="calibration()"
        [cropStyles]="cropStyles()"
        (naturalAspectRatioChange)="naturalAspectRatio.set($event)"
      />
    </div>
  }
</div>
