<div class="section-card space-y-4">
  <h3 class="section-title">
    <app-photo-filter-icon />
    Visual Enhancer Calibration
  </h3>

  @if (showSkeleton()) {
    <app-image-improvement-skeleton />
  } @else {
    <div class="improvement-grid">
      <app-image-crop [calibration]="calibration()" />

      <!-- Enhanced Canvas -->
      <app-enhanced-canvas [imageUrl]="imageUrl()" [calibration]="calibration()" />
    </div>
  }
</div>
