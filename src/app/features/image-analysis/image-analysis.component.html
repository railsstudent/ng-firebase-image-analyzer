<div class="workspace-container">
  <!-- Upload State Area -->
  <app-image-uploader
    [(imageUrl)]="imageUrl"
    [disabled]="isWarming()"
    [warmingMessage]="warmingMessage()"
    (fileSelected)="onFileSelected($event)"
    (imageRemoved)="onImageRemoved()"
  ></app-image-uploader>

  @if (errorMessage()) {
    <div class="error-banner">
      <div class="error-icon-badge">
        <app-error-icon />
      </div>
      <div class="error-content-body">
        <p class="error-text">{{ errorMessage() }}</p>
      </div>
    </div>
  }

  <!-- Explicit Analyze Action Button -->
  @if (imageUrl() && !isLoading()) {
    <div class="action-container">
      <button (click)="triggerAnalysis()" class="primary-action-btn">
        <app-psychology-icon />
        Analyze Image ({{ seconds() }}s)
      </button>
    </div>
  }

  @if (isLoading()) {
    <div class="streaming-loader-container">
      <div class="streaming-loader-badge">
        <app-sync-icon class="streaming-loader-icon" />
        <span class="streaming-loader-text">Streaming AI Insights ({{ seconds() }}s)...</span>
      </div>
    </div>
  }

  @if (tags().length > 0) {
    <!-- Semantic Tag Cloud -->
    <div class="tag-cloud-section animate-fade-in">
      <h4 class="section-subtitle">Detected Classifications</h4>
      <app-tag-list [tags]="tags()"></app-tag-list>
    </div>

    @if (analysisData()) {
      <!-- Advanced Analysis Results Panel -->
      <app-image-analysis-panel
        class="animate-fade-in block"
        [data]="analysisData()"
        [imageUrl]="imageUrl()"
        [source]="source()"
      ></app-image-analysis-panel>
    }
  }
</div>
