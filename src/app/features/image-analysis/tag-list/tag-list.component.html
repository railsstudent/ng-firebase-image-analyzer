<div class="flex flex-wrap gap-2.5">
  @for (tag of tags(); track tag.label) {
    <app-badge [label]="tag.label" [tooltip]="tag.tooltip" />
  } @empty {
    <p class="text-sm text-on-surface-variant italic">
      No tags detected yet. Run image analysis to extract visual labels.
    </p>
  }
</div>
