<div class="space-y-4 max-w-[400px] mx-auto">
  <div class="canvas-container border shadow-sm relative" [style.aspect-ratio]="containerAspectRatio()">
    @if (imageUrl(); as url) {
      @let wrapperStyle = containerCss();
      @let imageStyle = cropImage().imageStyle;
      @if (wrapperStyle && imageStyle) {
        <div [style]="wrapperStyle">
          <img
            style="display: block"
            [src]="url"
            (load)="onImageLoad($event)"
            [style.filter]="calibration().filterStyle"
            alt="Cropped subject"
            [style]="imageStyle"
          />
        </div>

        <!-- Download button floating hover -->
        <button
          type="button"
          class="download-enhanced-btn font-medium shadow-lg duration-200"
          [appDownloadEnhanced]="url"
          [calibration]="calibration()"
        >
          <app-download-icon />
          Download PNG
        </button>
        <div class="canvas-badge shadow-lg font-bold">AI ENHANCED</div>
      } @else {
        <div class="text-sm text-on-surface-variant italic">No image improvement available</div>
      }
    } @else {
      <div class="text-sm text-on-surface-variant italic">No image selected for preview</div>
    }
  </div>
</div>
