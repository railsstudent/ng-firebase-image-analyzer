<div class="max-w-[400px] mx-auto">
  <div
    class="canvas-container border shadow-sm relative"
    [style.aspect-ratio]="cropStyles().containerStyle.aspectRatio"
  >
    @if (imageUrl(); as url) {
      @let wrapperStyle = cropStyles().containerStyle;
      @let imageStyle = cropStyles().imageStyle;
      @if (wrapperStyle && imageStyle) {
        <div [style]="wrapperStyle">
          <img
            style="display: block"
            [src]="url"
            (load)="onImageLoad($event)"
            (error)="onImageError()"
            [style.filter]="calibration().filterStyle"
            alt="Cropped subject"
            [style]="imageStyle"
          />
        </div>

        <!-- Download button floating hover -->
        <button
          type="button"
          class="download-enhanced-btn font-medium shadow-lg"
          [appDownloadEnhanced]="url"
          [calibration]="calibration()"
        >
          <app-download-icon />
          Download PNG
        </button>
        <div class="canvas-badge shadow-lg font-bold">AI ENHANCED</div>
      } @else {
        <div class="text-sm text-on-surface-variant italic">No image improvement available</div>
      }
    } @else {
      <div class="text-sm text-on-surface-variant italic">No image selected for preview</div>
    }
  </div>
</div>
