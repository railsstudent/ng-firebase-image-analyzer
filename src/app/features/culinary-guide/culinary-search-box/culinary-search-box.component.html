<div class="search-box-card backdrop-blur-md shadow-sm">
  <form class="search-form gap-3 w-full" (submit)="onSubmit($event)">
    <div class="flex-1 relative">
      <label class="section-subtitle font-semibold" for="country-select">Country</label>
      <select
        id="country-select"
        class="select-control focus:ring-2 focus:ring-primary/50"
        [formField]="searchForm.country"
        #countrySelect
        (change)="onCountryChange(countrySelect.value)"
      >
        @for (item of destinations(); track item.country) {
          <option [value]="item.country">{{ item.country }}</option>
        }
      </select>
    </div>

    <div class="flex-1 relative">
      <label class="section-subtitle font-semibold" for="city-input">City</label>
      <input
        id="city-input"
        type="text"
        class="select-control focus:ring-2 focus:ring-primary/50"
        placeholder="Enter city..."
        role="combobox"
        aria-haspopup="listbox"
        aria-autocomplete="list"
        [attr.aria-expanded]="isDropdownOpen()"
        aria-controls="city-listbox"
        [attr.aria-activedescendant]="cityOptionId()"
        [formField]="searchForm.city"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="search"
        (focus)="toggleDropdown(true)"
        (blur)="toggleDropdown(false)"
        (keydown.arrowup)="navigateOptions('up', $event)"
        (keydown.arrowdown)="navigateOptions('down', $event)"
        (keydown.enter)="onEnter($event)"
        (keydown.escape)="toggleDropdown(false, $event)"
        (keydown.tab)="toggleDropdown(false)"
      />

      @if (isDropdownOpen() && filteredCities().length > 0) {
        <ul id="city-listbox" class="listbox-overlay shadow-lg p-1" role="listbox" aria-label="Suggested cities">
          @for (city of filteredCities(); track city; let i = $index) {
            @let isSelected = activeOptionIndex() === i;
            <li
              #cityOption
              [id]="`city-option-${i}`"
              class="listbox-option cursor-pointer select-none"
              [class.listbox-option-active]="isSelected"
              [class.font-medium]="isSelected"
              role="option"
              [attr.aria-selected]="isSelected"
              (mousedown)="selectCity(city, $event)"
            >
              {{ city }}
            </li>
          }
        </ul>
      }
    </div>

    <button
      type="submit"
      class="submit-btn font-semibold shadow-md"
      [disabled]="isSearchDisabled()"
      [attr.aria-disabled]="isSearchDisabled()"
    >
      @if (isLoading()) {
        <app-sync-icon class="text-on-primary w-4 h-4" />
      }
      <span>Search</span>
    </button>
  </form>
</div>
